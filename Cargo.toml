[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/browsers", "crates/app", "src-tauri"]

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
unicode-segmentation = "1"
proptest = "1"
tempfile = "3"
plist = "1"
tracing = "0.1"
insta = { version = "1", features = ["json", "redactions"] }
tabstage-core = { path = "crates/core" }
tabstage-store = { path = "crates/store" }
tabstage-browsers = { path = "crates/browsers" }
tabstage-app = { path = "crates/app" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "warn"
must_use_candidate = "warn"
missing_errors_doc = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
